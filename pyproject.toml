[project]
name = "kickbase"
version = "0.1.0"
description = "Live Kickbase league scoreboard rendered to a static HTML page"
readme = "README.md"
authors = [
    { name = "Steffen Fohr" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
]

[project.scripts]
kickbase = "kb:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kb"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
]
