[project]
name = "kickbase"
version = "0.1.0"
description = "Live Kickbase league scoreboard rendered to a static HTML page"
readme = "README.md"
authors = [
    { name = "Steffen Fohr" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
update_scoreboard = "kb.scoreboard:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kb"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "SIM",  # simplify
    "UP",   # pyupgrade
]

[tool.mypy]
strict = true
files = ["kb"]

[[tool.mypy.overrides]]
# Tests stay unannotated, but their bodies are still type-checked.
module = "kb.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["kb/tests"]
addopts = "--strict-markers"
